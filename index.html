<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKJ Cyber Citadel - DDoS & Malware Defense</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #05050a;
            color: #00f3ff;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { font-size: 1.6rem; text-shadow: 0 0 12px #00f3ff; margin-bottom: 4px; }
        p { color: #a0a5c0; font-size: 0.85rem; margin-bottom: 12px; }
        #gameWrapper { position: relative; }
        canvas {
            border: 2px solid #00f3ff;
            border-radius: 10px;
            background: #0a0a14;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
        }
        .hud {
            position: absolute;
            top: 12px; left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 8px #000;
        }
        #bossBarContainer {
            position: absolute;
            top: 45px; left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 14px;
            background: rgba(255,0,0,0.2);
            border: 1px solid #ff0055;
            border-radius: 7px;
            overflow: hidden;
            display: none;
        }
        #bossBar { width: 100%; height: 100%; background: #ff0055; transition: width 0.1s; }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        button {
            margin-top: 18px;
            padding: 12px 30px;
            background: #00f3ff;
            color: #05050a;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px #00f3ff;
            transition: 0.2s;
        }
        button:hover { background: #ff0055; color: white; box-shadow: 0 0 20px #ff0055; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>CYBER CITADEL: MALWARE STRIKE</h1>
    <p>[A/D] atau [Panah] Bergerak | [SPASI] Tembak | Tembak Power-Up Neon!</p>

    <div id="gameWrapper">
        <canvas id="canvas" width="480" height="600"></canvas>
        <div class="hud">
            <div>SCORE: <span id="score">0</span> <span id="combo" style="color:#ffd700; font-size:0.9rem"></span></div>
            <div>SHIELD: <span id="hp" style="color:#00ff66">100%</span></div>
        </div>
        <div id="bossBarContainer">
            <div id="bossBar"></div>
        </div>

        <div id="overlay">
            <h2 id="ovTitle" style="color: #ff0055; font-size: 2rem; text-shadow: 0 0 15px #ff0055; margin-bottom: 10px;">SYSTEM BREACHED</h2>
            <p style="color: #ffffff;">Skor Akhir: <span id="ovScore">0</span></p>
            <p style="color: #ffd700; margin-top:5px;">High Score: <span id="ovHigh">0</span></p>
            <button onclick="resetGame()">INITIALIZE SYSTEM</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const hpEl = document.getElementById('hp');
const overlay = document.getElementById('overlay');
const bossBarContainer = document.getElementById('bossBarContainer');
const bossBar = document.getElementById('bossBar');

// Audio Synthesizer Bawaan Browser
const audio = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    try {
        if(audio.state === 'suspended') audio.resume();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.connect(gain); gain.connect(audio.destination);
        const now = audio.currentTime;
        if(type === 'shoot') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
            gain.gain.setValueAtTime(0.08, now); osc.start(now); osc.stop(now + 0.08);
        } else if(type === 'hit') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.15);
            gain.gain.setValueAtTime(0.15, now); osc.start(now); osc.stop(now + 0.15);
        } else if(type === 'powerup') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); osc.start(now); osc.stop(now + 0.2);
        }
    } catch(e){}
}

let keys = {}, bullets = [], enemies = [], particles = [], powerups = [], boss = null;
let score = 0, combo = 0, hp = 100, highScore = localStorage.getItem('pkj_high') || 0;
let shakeTimer = 0, tripleShotTimer = 0, shieldActive = false, gameLoop;

let player = { x: 215, y: 520, w: 50, h: 40, speed: 7 };

document.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') shoot(); });
document.addEventListener('keyup', e => keys[e.code] = false);

// Touch Support HP
canvas.addEventListener('touchmove', e => {
    let r = canvas.getBoundingClientRect();
    player.x = Math.max(0, Math.min(canvas.width - player.w, e.touches[0].clientX - r.left - player.w/2));
    shoot();
    e.preventDefault();
}, {passive:false});

function shoot() {
    if(overlay.classList.contains('hidden') == false) return;
    playSound('shoot');
    if(tripleShotTimer > 0) {
        bullets.push({x: player.x + 5, y: player.y, vx: -2, vy: -10});
        bullets.push({x: player.x + 22, y: player.y - 5, vx: 0, vy: -10});
        bullets.push({x: player.x + 40, y: player.y, vx: 2, vy: -10});
    } else {
        bullets.push({x: player.x + 22, y: player.y - 5, vx: 0, vy: -10});
    }
}

function createExplosion(x, y, color, count=12) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1, color, size: Math.random()*4 + 2
        });
    }
}

function spawnEnemy() {
    if(boss) return;
    const types = [
        { type: 'ddos', color: '#00f3ff', hp: 1, speed: 4, points: 10, size: 24 },
        { type: 'trojan', color: '#ff0055', hp: 2, speed: 2.5, points: 25, size: 30 },
        { type: 'ransom', color: '#ffd700', hp: 4, speed: 1.5, points: 50, size: 34 }
    ];
    let r = Math.random();
    let selected = types[0];
    if(r > 0.5) selected = types[1];
    if(r > 0.8) selected = types[2];

    enemies.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: -40, angle: 0, ...selected
    });

    // Spawn Boss at 400 Score
    if(score >= 400 && !boss && Math.random() < 0.1) {
        boss = { x: 180, y: -80, w: 120, h: 70, hp: 50, maxHp: 50, vx: 3, attackTimer: 0 };
        bossBarContainer.style.display = 'block';
    }
}

function spawnPowerup(x, y) {
    if(Math.random() < 0.25) {
        const kinds = ['SHIELD', 'TRIPLE', 'NUKE'];
        powerups.push({ x, y, type: kinds[Math.floor(Math.random()*kinds.length)], vy: 2 });
    }
}

function resetGame() {
    score = 0; combo = 0; hp = 100;
    bullets = []; enemies = []; particles = []; powerups = []; boss = null;
    tripleShotTimer = 0; shieldActive = false;
    scoreEl.innerText = 0; comboEl.innerText = ''; hpEl.innerText = '100%';
    bossBarContainer.style.display = 'none';
    overlay.classList.add('hidden');
    clearInterval(gameLoop);
    gameLoop = setInterval(update, 1000/60);
}

function update() {
    // Screen Shake
    let sx = 0, sy = 0;
    if(shakeTimer > 0) {
        shakeTimer--;
        sx = (Math.random()-0.5)*10; sy = (Math.random()-0.5)*10;
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.clearRect(-20, -20, canvas.width+40, canvas.height+40);

    // Dynamic Background Grid
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=30) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    for(let j=0; j<canvas.height; j+=30) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

    // Player Controls
    if(keys['ArrowLeft'] || keys['KeyA']) if(player.x > 0) player.x -= player.speed;
    if(keys['ArrowRight'] || keys['KeyD']) if(player.x < canvas.width - player.w) player.x += player.speed;
    if(tripleShotTimer > 0) tripleShotTimer--;

    // Draw Player Router (Visual Vector Graphic)
    ctx.shadowBlur = 15; ctx.shadowColor = '#00f3ff';
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(player.x + 10, player.y + 15, 30, 20); // Main Body
    ctx.fillRect(player.x + 5, player.y + 5, 4, 15);    // Left Antenna
    ctx.fillRect(player.x + 41, player.y + 5, 4, 15);   // Right Antenna
    ctx.fillStyle = '#05050a'; ctx.fillRect(player.x + 15, player.y + 20, 20, 5); // Port Indicator

    if(shieldActive) {
        ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x+25, player.y+20, 32, 0, Math.PI*2); ctx.stroke();
    }

    // Bullets Update & Draw
    ctx.fillStyle = '#00ff66'; ctx.shadowColor = '#00ff66';
    for(let i=bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        ctx.fillRect(b.x, b.y, 5, 12);
        if(b.y < -10 || b.x < 0 || b.x > canvas.width) bullets.splice(i,1);
    }

    // Spawning Enemies
    if(Math.random() < 0.04) spawnEnemy();

    // Enemies Update & Draw
    for(let i=enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        e.angle += 0.05;

        ctx.shadowBlur = 12; ctx.shadowColor = e.color;
        ctx.fillStyle = e.color;
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.angle);

        // Custom Graphics Enemy Type
        if(e.type === 'ddos') {
            // Triangle Spike
            ctx.beginPath(); ctx.moveTo(0,-e.size/2); ctx.lineTo(e.size/2, e.size/2); ctx.lineTo(-e.size/2, e.size/2); ctx.closePath(); ctx.fill();
        } else if(e.type === 'trojan') {
            // Hexagon Virus
            ctx.fillRect(-e.size/2, -e.size/2, e.size, e.size);
        } else {
            // Skull/Lock Octagon
            ctx.beginPath(); ctx.arc(0,0, e.size/2, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();

        // Collision with Bullets
        for(let j=bullets.length-1; j>=0; j--) {
            let b = bullets[j];
            if(Math.hypot(b.x - e.x, b.y - e.y) < e.size) {
                e.hp--;
                bullets.splice(j,1);
                createExplosion(e.x, e.y, e.color, 6);
                if(e.hp <= 0) {
                    playSound('hit');
                    score += e.points;
                    combo++;
                    comboEl.innerText = `x${combo} COMBO!`;
                    scoreEl.innerText = score;
                    spawnPowerup(e.x, e.y);
                    createExplosion(e.x, e.y, e.color, 15);
                    enemies.splice(i,1);
                    break;
                }
            }
        }

        // Hit Player
        if(e && Math.hypot(player.x+25 - e.x, player.y+20 - e.y) < e.size + 15) {
            enemies.splice(i,1);
            takeDamage(20);
        } else if(e && e.y > canvas.height + 30) {
            enemies.splice(i,1);
            combo = 0; comboEl.innerText = '';
        }
    }

    // BOSS MALWARE Logic
    if(boss) {
        if(boss.y < 60) boss.y += 2;
        boss.x += boss.vx;
        if(boss.x < 20 || boss.x > canvas.width - boss.w - 20) boss.vx *= -1;

        // Draw Boss Graphic
        ctx.shadowBlur = 20; ctx.shadowColor = '#ff0055';
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        ctx.fillStyle = '#05050a';
        ctx.fillText("MAINFRAME_VIRUS", boss.x + 10, boss.y + 40);

        // Boss Bullet Hits
        for(let j=bullets.length-1; j>=0; j--) {
            let b = bullets[j];
            if(b.x > boss.x && b.x < boss.x+boss.w && b.y > boss.y && b.y < boss.y+boss.h) {
                boss.hp--;
                bullets.splice(j,1);
                createExplosion(b.x, b.y, '#ff0055', 5);
                bossBar.style.width = `${(boss.hp / boss.maxHp) * 100}%`;
                if(boss.hp <= 0) {
                    score += 500;
                    scoreEl.innerText = score;
                    createExplosion(boss.x+60, boss.y+35, '#ff0055', 50);
                    boss = null;
                    bossBarContainer.style.display = 'none';
                    break;
                }
            }
        }
    }

    // Power-ups Collect
    for(let i=powerups.length-1; i>=0; i--) {
        let p = powerups[i];
        p.y += p.vy;
        ctx.shadowBlur = 10; ctx.shadowColor = '#ffd700';
        ctx.fillStyle = '#ffd700';
        ctx.font = '12px monospace';
        ctx.fillText(`[${p.type}]`, p.x, p.y);

        if(Math.hypot(player.x+25 - p.x, player.y+20 - p.y) < 30) {
            playSound('powerup');
            if(p.type === 'SHIELD') shieldActive = true;
            if(p.type === 'TRIPLE') tripleShotTimer = 300;
            if(p.type === 'NUKE') {
                enemies.forEach(e => createExplosion(e.x, e.y, e.color, 12));
                enemies = [];
            }
            powerups.splice(i,1);
        } else if(p.y > canvas.height) powerups.splice(i,1);
    }

    // Particles Draw
    for(let i=particles.length-1; i>=0; i--) {
        let pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.03;
        ctx.fillStyle = pt.color; ctx.shadowBlur = 5; ctx.shadowColor = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        if(pt.life <= 0) particles.splice(i,1);
    }

    ctx.restore();
}

function takeDamage(amt) {
    if(shieldActive) { shieldActive = false; return; }
    shakeTimer = 15;
    playSound('hit');
    hp -= amt;
    hpEl.innerText = `${Math.max(0, hp)}%`;
    if(hp <= 0) {
        clearInterval(gameLoop);
        if(score > highScore) { highScore = score; localStorage.setItem('pkj_high', highScore); }
        document.getElementById('ovScore').innerText = score;
        document.getElementById('ovHigh').innerText = highScore;
        overlay.classList.remove('hidden');
    }
}

resetGame();
</script>
</body>
</html>
