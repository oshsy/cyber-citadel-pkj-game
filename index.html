<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PKJ Cyber Citadel - DDoS & Malware Defense</title>
    <!-- Favicon Tab Browser -->
    <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }
        
        h1 { 
            font-size: 1.3rem; 
            color: #38bdf8; 
            letter-spacing: 1px;
            margin-bottom: 3px; 
            text-align: center; 
        }
        .subtitle { 
            color: #64748b; 
            font-size: 0.78rem; 
            margin-bottom: 10px; 
            text-align: center; 
        }
        
        #gameWrapper { 
            position: relative; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
        }
        
        /* RESPONSIVE AUTO-SCALE CANVAS */
        canvas {
            border: 1px solid #1e293b;
            border-radius: 12px;
            background: #0f172a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
            aspect-ratio: 480 / 600;
            touch-action: none;
        }

        .hud {
            position: absolute;
            top: 12px; left: 16px; right: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            pointer-events: none;
            color: #f1f5f9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        #bossBarContainer {
            position: absolute;
            top: 40px; left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 10px;
            background: rgba(244, 63, 94, 0.2);
            border: 1px solid #f43f5e;
            border-radius: 5px;
            overflow: hidden;
            display: none;
        }
        #bossBar { width: 100%; height: 100%; background: #f43f5e; transition: width 0.1s; }
        
        /* OVERLAY / START SCREEN MODERN DARK UI */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .author-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 10px 16px;
            margin: 12px 0 14px 0;
            width: 100%;
            max-width: 360px;
        }

        .author-name {
            color: #fbbf24; 
            font-weight: 700; 
            font-size: 0.95rem;
            margin-top: 2px;
        }

        .author-sub {
            font-size: 0.75rem; 
            color: #94a3b8; 
            margin-top: 2px;
        }

        /* LEGENDA GRID YANG RAPI & MATAK NYAMAN */
        .icon-legend-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 16px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 8px;
            padding: 12px 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .legend-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .legend-item img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .legend-item span {
            font-size: 0.68rem;
            color: #cbd5e1;
            white-space: nowrap;
        }

        /* BUTTON DESIGN ELEGAN (TIDAK FULL BIRU NEON) */
        button {
            padding: 12px 32px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
        }
        button:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>CYBER CITADEL</h1>
    <div class="subtitle">[A/D / Panah] Gerak | [SPASI] Tembak | Touch HP</div>

    <div id="gameWrapper">
        <canvas id="canvas" width="480" height="600"></canvas>
        <div class="hud">
            <div>SCORE: <span id="score" style="color:#38bdf8;">0</span> <span id="combo" style="color:#fbbf24; font-size:0.8rem"></span></div>
            <div>SHIELD: <span id="hp" style="color:#34d399">100%</span></div>
        </div>
        <div id="bossBarContainer">
            <div id="bossBar"></div>
        </div>

        <!-- START SCREEN HASIL KARYA -->
        <div id="startScreen" class="overlay-screen">
            <h2 style="color: #38bdf8; font-size: 1.4rem; font-weight: 700;">MALWARE STRIKE</h2>
            
            <div class="author-box">
                <div style="font-size: 0.72rem; color: #38bdf8; letter-spacing: 1px;">KARYA MANDIRI PKJ</div>
                <div class="author-name">Razid Rahmanto</div>
                <div class="author-sub">D2 Pemeliharaan Komputer & Jaringan</div>
                <div style="font-size: 0.7rem; color: #64748b; margin-top: 1px;">AKN Pacitan</div>
            </div>

            <!-- LEGENDA ICON PANDUAN DOSEN -->
            <div class="icon-legend-grid">
                <div class="legend-item">
                    <img src="player.png" alt="Router" onerror="this.style.display='none'">
                    <span>Router</span>
                </div>
                <div class="legend-item">
                    <img src="enemy_ddos.png" alt="DDoS" onerror="this.style.display='none'">
                    <span>DDoS Missile</span>
                </div>
                <div class="legend-item">
                    <img src="enemy_trojan.png" alt="Trojan" onerror="this.style.display='none'">
                    <span>Trojan Virus</span>
                </div>
                <div class="legend-item">
                    <img src="enemy_ransom.png" alt="Malware" onerror="this.style.display='none'">
                    <span>Ransomware</span>
                </div>
                <div class="legend-item">
                    <img src="boss.png" alt="Boss" onerror="this.style.display='none'">
                    <span>Mega Boss</span>
                </div>
                <div class="legend-item">
                    <img src="power_shield.png" alt="Shield" onerror="this.style.display='none'">
                    <span>Shield Power</span>
                </div>
            </div>

            <button onclick="startGame()">START SYSTEM</button>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameOverScreen" class="overlay-screen hidden">
            <h2 id="ovTitle" style="color: #f43f5e; font-size: 1.6rem; font-weight:700; margin-bottom: 8px;">SYSTEM BREACHED</h2>
            <p style="color: #94a3b8; font-size: 0.9rem;">Skor Akhir: <span id="ovScore" style="color:#ffffff; font-weight:bold;">0</span></p>
            <p style="color: #fbbf24; font-size: 0.85rem; margin-top:4px; margin-bottom: 16px;">High Score: <span id="ovHigh">0</span></p>
            <button onclick="startGame()">REBOOT SYSTEM</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const hpEl = document.getElementById('hp');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const bossBarContainer = document.getElementById('bossBarContainer');
const bossBar = document.getElementById('bossBar');

// Load Aset Gambar Icon
const imgs = {
    player: new Image(),
    ddos: new Image(),
    trojan: new Image(),
    ransom: new Image(),
    boss: new Image(),
    p_shield: new Image(),
    p_triple: new Image(),
    p_nuke: new Image()
};
imgs.player.src = 'player.png';
imgs.ddos.src = 'enemy_ddos.png';
imgs.trojan.src = 'enemy_trojan.png';
imgs.ransom.src = 'enemy_ransom.png';
imgs.boss.src = 'boss.png';
imgs.p_shield.src = 'power_shield.png';
imgs.p_triple.src = 'power_triple.png';
imgs.p_nuke.src = 'power_nuke.png';

// Audio Synthesizer Browser
const audio = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    try {
        if(audio.state === 'suspended') audio.resume();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.connect(gain); gain.connect(audio.destination);
        const now = audio.currentTime;
        if(type === 'shoot') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(700, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.07);
            gain.gain.setValueAtTime(0.06, now); osc.start(now); osc.stop(now + 0.07);
        } else if(type === 'hit') {
            osc.type = 'square'; osc.frequency.setValueAtTime(140, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.12);
            gain.gain.setValueAtTime(0.12, now); osc.start(now); osc.stop(now + 0.12);
        } else if(type === 'powerup') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.18);
            gain.gain.setValueAtTime(0.08, now); osc.start(now); osc.stop(now + 0.18);
        }
    } catch(e){}
}

let keys = {}, bullets = [], enemies = [], particles = [], powerups = [], boss = null;
let score = 0, combo = 0, hp = 100, highScore = localStorage.getItem('pkj_high') || 0;
let shakeTimer = 0, tripleShotTimer = 0, shieldActive = false, gameLoop;
let isPlaying = false;

let player = { x: 214, y: 510, w: 52, h: 52, speed: 7 };

document.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if(e.code==='Space') shoot(); 
});
document.addEventListener('keyup', e => keys[e.code] = false);

// Touch Support HP
function handleTouch(e) {
    if(!isPlaying) return;
    let r = canvas.getBoundingClientRect();
    let scaleX = canvas.width / r.width;
    let touchX = (e.touches[0].clientX - r.left) * scaleX;
    player.x = Math.max(0, Math.min(canvas.width - player.w, touchX - player.w / 2));
    shoot();
    e.preventDefault();
}
canvas.addEventListener('touchstart', handleTouch, {passive:false});
canvas.addEventListener('touchmove', handleTouch, {passive:false});

function shoot() {
    if(!isPlaying) return;
    playSound('shoot');
    if(tripleShotTimer > 0) {
        bullets.push({x: player.x + 4, y: player.y, w: 6, h: 14, vx: -2, vy: -10});
        bullets.push({x: player.x + player.w/2 - 3, y: player.y - 5, w: 6, h: 14, vx: 0, vy: -10});
        bullets.push({x: player.x + player.w - 10, y: player.y, w: 6, h: 14, vx: 2, vy: -10});
    } else {
        bullets.push({x: player.x + player.w/2 - 3, y: player.y - 5, w: 6, h: 14, vx: 0, vy: -10});
    }
}

function createExplosion(x, y, color, count=12) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1, color, size: Math.random()*3 + 2
        });
    }
}

function spawnEnemy() {
    if(boss) return;
    const types = [
        { type: 'ddos', color: '#38bdf8', hp: 1, speed: 3.8, points: 10, w: 32, h: 54, imgKey: 'ddos', label: 'DDoS' },
        { type: 'trojan', color: '#f43f5e', hp: 2, speed: 2.5, points: 25, w: 44, h: 44, imgKey: 'trojan', label: 'TROJAN' },
        { type: 'ransom', color: '#fbbf24', hp: 4, speed: 1.6, points: 50, w: 46, h: 46, imgKey: 'ransom', label: 'VIRUS' }
    ];
    let r = Math.random();
    let selected = types[0];
    if(r > 0.5) selected = types[1];
    if(r > 0.8) selected = types[2];

    enemies.push({
        x: Math.random() * (canvas.width - selected.w),
        y: -60, ...selected
    });

    if(score >= 400 && !boss && Math.random() < 0.08) {
        boss = { x: 192, y: -100, w: 96, h: 96, hp: 50, maxHp: 50, vx: 3, imgKey: 'boss' };
        bossBarContainer.style.display = 'block';
    }
}

function spawnPowerup(x, y) {
    if(Math.random() < 0.25) {
        const kinds = ['SHIELD', 'TRIPLE', 'NUKE'];
        const type = kinds[Math.floor(Math.random()*kinds.length)];
        let imgKey = 'p_shield';
        if(type === 'TRIPLE') imgKey = 'p_triple';
        if(type === 'NUKE') imgKey = 'p_nuke';
        powerups.push({ x: x - 16, y, type, imgKey, vy: 2, w: 32, h: 32 });
    }
}

function startGame() {
    score = 0; combo = 0; hp = 100;
    bullets = []; enemies = []; particles = []; powerups = []; boss = null;
    tripleShotTimer = 0; shieldActive = false; isPlaying = true;
    player.x = 214;
    scoreEl.innerText = 0; comboEl.innerText = ''; hpEl.innerText = '100%';
    bossBarContainer.style.display = 'none';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    clearInterval(gameLoop);
    gameLoop = setInterval(update, 1000/60);
}

// AABB Box Collision
function isColliding(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

function update() {
    let sx = 0, sy = 0;
    if(shakeTimer > 0) {
        shakeTimer--;
        sx = (Math.random()-0.5)*8; sy = (Math.random()-0.5)*8;
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.clearRect(-20, -20, canvas.width+40, canvas.height+40);

    // Subtle Background Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=30) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    for(let j=0; j<canvas.height; j+=30) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

    // Control Player Keyboard
    if(keys['ArrowLeft'] || keys['KeyA']) if(player.x > 0) player.x -= player.speed;
    if(keys['ArrowRight'] || keys['KeyD']) if(player.x < canvas.width - player.w) player.x += player.speed;
    if(tripleShotTimer > 0) tripleShotTimer--;

    // Render Player Router
    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(56, 189, 248, 0.4)';
    if(imgs.player.complete && imgs.player.naturalWidth !== 0) {
        ctx.drawImage(imgs.player, player.x, player.y, player.w, player.h);
    } else {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(player.x + 10, player.y + 15, 32, 25);
        ctx.fillRect(player.x + 5, player.y + 5, 4, 15);
        ctx.fillRect(player.x + 43, player.y + 5, 4, 15);
    }

    if(shieldActive) {
        ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(player.x+player.w/2, player.y+player.h/2, 35, 0, Math.PI*2); ctx.stroke();
    }

    // Bullets
    ctx.fillStyle = '#34d399'; ctx.shadowBlur = 6; ctx.shadowColor = '#34d399';
    for(let i=bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if(b.y < -20 || b.x < -10 || b.x > canvas.width + 10) bullets.splice(i,1);
    }

    if(Math.random() < 0.035) spawnEnemy();

    const isBlink = Math.floor(Date.now() / 300) % 2 === 0;

    // Enemies
    for(let i=enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.y += e.speed;

        ctx.shadowBlur = 8; ctx.shadowColor = e.color;
        let img = imgs[e.imgKey];
        if(img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, e.x, e.y, e.w, e.h);
        } else {
            ctx.fillStyle = e.color;
            ctx.fillRect(e.x, e.y, e.w, e.h);
        }

        // Label Di Atas Icon
        if(isBlink) {
            ctx.fillStyle = '#f43f5e';
            ctx.font = '600 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#f43f5e';
            ctx.fillText(e.label, e.x + e.w/2, e.y - 6);
            ctx.textAlign = 'left';
        }

        // Bullet vs Enemy
        let enemyHit = false;
        for(let j=bullets.length-1; j>=0; j--) {
            let b = bullets[j];
            if(isColliding(b, e)) {
                e.hp--;
                bullets.splice(j,1);
                createExplosion(b.x + b.w/2, b.y, e.color, 6);
                if(e.hp <= 0) {
                    playSound('hit');
                    score += e.points;
                    combo++;
                    comboEl.innerText = `x${combo} COMBO!`;
                    scoreEl.innerText = score;
                    spawnPowerup(e.x + e.w/2, e.y + e.h/2);
                    createExplosion(e.x + e.w/2, e.y + e.h/2, e.color, 15);
                    enemies.splice(i,1);
                    enemyHit = true;
                    break;
                }
            }
        }
        if(enemyHit) continue;

        // Enemy vs Player
        if(isColliding(e, player)) {
            enemies.splice(i,1);
            createExplosion(e.x + e.w/2, e.y + e.h/2, '#f43f5e', 20);
            takeDamage(20);
        } else if(e.y > canvas.height + 40) {
            enemies.splice(i,1);
            combo = 0; comboEl.innerText = '';
        }
    }

    // Boss Malware
    if(boss) {
        if(boss.y < 50) boss.y += 2;
        boss.x += boss.vx;
        if(boss.x < 10 || boss.x > canvas.width - boss.w - 10) boss.vx *= -1;

        ctx.shadowBlur = 12; ctx.shadowColor = '#f43f5e';
        if(imgs.boss.complete && imgs.boss.naturalWidth !== 0) {
            ctx.drawImage(imgs.boss, boss.x, boss.y, boss.w, boss.h);
        } else {
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        }

        if(isBlink) {
            ctx.fillStyle = '#f43f5e';
            ctx.font = '600 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#f43f5e';
            ctx.fillText("⚠️ MEGA VIRUS BOSS ⚠️", boss.x + boss.w/2, boss.y - 8);
            ctx.textAlign = 'left';
        }

        for(let j=bullets.length-1; j>=0; j--) {
            let b = bullets[j];
            if(isColliding(b, boss)) {
                boss.hp--;
                bullets.splice(j,1);
                createExplosion(b.x, b.y, '#f43f5e', 5);
                bossBar.style.width = `${(boss.hp / boss.maxHp) * 100}%`;
                if(boss.hp <= 0) {
                    score += 500;
                    scoreEl.innerText = score;
                    createExplosion(boss.x+boss.w/2, boss.y+boss.h/2, '#f43f5e', 50);
                    boss = null;
                    bossBarContainer.style.display = 'none';
                    break;
                }
            }
        }
    }

    // Power-ups Render
    for(let i=powerups.length-1; i>=0; i--) {
        let p = powerups[i];
        p.y += p.vy;
        ctx.shadowBlur = 8; ctx.shadowColor = '#fbbf24';

        let pImg = imgs[p.imgKey];
        if(pImg.complete && pImg.naturalWidth !== 0) {
            ctx.drawImage(pImg, p.x, p.y, p.w, p.h);
        } else {
            ctx.fillStyle = '#fbbf24';
            ctx.font = '11px sans-serif';
            ctx.fillText(`[${p.type}]`, p.x, p.y);
        }

        if(isColliding(p, player)) {
            playSound('powerup');
            if(p.type === 'SHIELD') shieldActive = true;
            if(p.type === 'TRIPLE') tripleShotTimer = 300;
            if(p.type === 'NUKE') {
                enemies.forEach(e => createExplosion(e.x+e.w/2, e.y+e.h/2, e.color, 12));
                enemies = [];
            }
            powerups.splice(i,1);
        } else if(p.y > canvas.height) powerups.splice(i,1);
    }

    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        let pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.03;
        ctx.fillStyle = pt.color; ctx.shadowBlur = 4; ctx.shadowColor = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        if(pt.life <= 0) particles.splice(i,1);
    }

    ctx.restore();
}

function takeDamage(amt) {
    if(shieldActive) { shieldActive = false; return; }
    shakeTimer = 15;
    playSound('hit');
    hp -= amt;
    hpEl.innerText = `${Math.max(0, hp)}%`;
    if(hp <= 0) {
        isPlaying = false;
        clearInterval(gameLoop);
        if(score > highScore) { highScore = score; localStorage.setItem('pkj_high', highScore); }
        document.getElementById('ovScore').innerText = score;
        document.getElementById('ovHigh').innerText = highScore;
        gameOverScreen.classList.remove('hidden');
    }
}
</script>
</body>
</html>
